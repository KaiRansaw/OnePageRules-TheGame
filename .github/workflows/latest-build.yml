# Rolling "latest" Windows build for playtesters.
#
# Every push to the working branch (campaign-360) rebuilds the Windows archive with the same scripts/build-dist.sh the
# versioned release uses, then replaces the single GitHub Release tagged "latest" with it.
# Friends always download from one place: Releases -> "Latest build". Versioned releases
# (v* tags, release.yml) are unaffected and still the official path.
#
# Only a build that compiles AND passes the headless smoke game gets published; a red build
# leaves the previous "latest" in place.
name: Latest build

on:
  push:
    branches: [campaign-360]
  workflow_dispatch:

permissions:
  contents: write # gh release create/delete, moving the "latest" tag

# A newer push supersedes an in-flight build - only the newest commit should become "latest".
concurrency:
  group: latest-build
  cancel-in-progress: true

env:
  RULES_VERSION: OPR_3_6_0

jobs:
  latest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with rules-engine submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # See release.yml: ENGINE_TOKEN lets the job read the engine repo once it is private.
          token: ${{ secrets.ENGINE_TOKEN || github.token }}

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # zip ships on the runner image; only install it if missing, and don't let a flaky apt mirror fail the build.
      - name: Make sure zip is there
        run: |
          echo "::notice title=step::zip check started"
          if ! command -v zip >/dev/null; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq zip) || true
          fi
          command -v zip >/dev/null || { echo "::error title=zip missing::could not install zip"; exit 1; }

      # Smoke: one full bot-vs-bot headless game must finish cleanly before anything is published.
      # Failures are re-emitted as ::error:: annotations (last lines of output) because annotations are
      # readable through the checks API, which is all a cloud Claude session can see of a run.
      - name: Headless smoke game
        run: |
          echo "::notice title=step::smoke started"
          set +e
          printf "2\n2\n" | timeout 600 dotnet run -c Release --project FdgRaylib/FdgRaylib.csproj -- --headless > smoke.log 2>&1
          code=$?
          tail -5 smoke.log
          if [ $code -ne 0 ] || ! grep -q "Game result:" smoke.log; then
            echo "::error title=Smoke game failed::exit code $code"
            # One annotation per line, stripped to plain characters so nothing breaks the command syntax.
            grep -v "warning CS" smoke.log | tail -12 | tr -cd 'A-Za-z0-9 .,:/_()=+\-\n' | cut -c1-300 | while IFS= read -r line; do
              echo "::error title=smoke::${line//::/ }"
            done
            exit 1
          fi

      - name: Build Windows archive
        run: |
          echo "::notice title=step::build-dist started"
          set +e
          bash -x scripts/build-dist.sh win > dist.log 2>&1
          code=$?
          tail -5 dist.log
          if [ $code -ne 0 ]; then
            echo "::error title=build-dist failed::exit code $code"
            grep -v "warning CS" dist.log | tail -15 | tr -cd 'A-Za-z0-9 .,:/_()=+\-\n' | cut -c1-300 | while IFS= read -r line; do
              echo "::error title=dist::${line//::/ }"
            done
            exit 1
          fi

      # The Godot game (Kai, 2026-11-12: "both, Godot first"). Exported for Windows into the same folder as the Raylib
      # build, so both find the one Assets/ folder beside them. build-commit.txt is what the in-game Update button
      # compares with this release's commit.
      - name: Add the Godot game
        run: |
          echo "::notice title=step::godot export started"
          set +e
          GODOT_VER=4.7.2
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_mono_linux_x86_64.zip" \
            && unzip -q godot.zip -d "$HOME/godot" \
            && curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_mono_export_templates.tpz"
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=Godot download failed::exit code $code"; exit 1; fi
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VER}.stable.mono"
          mkdir -p "$TPL"
          unzip -q -o -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$TPL"
          rm -f templates.tpz godot.zip
          GODOT="$(ls "$HOME"/godot/*/Godot_v*_mono_linux.x86_64)"
          DIR="$(ls -d dist/FdgRaylib-win-x64)"
          "$GODOT" --headless --path OprGodot --import > godot.log 2>&1
          "$GODOT" --headless --path OprGodot --export-release "Windows Desktop" "$PWD/$DIR/OnePageRules.exe" >> godot.log 2>&1
          code=$?
          if [ $code -ne 0 ] || [ ! -f "$DIR/OnePageRules.exe" ] || [ ! -d "$DIR/data_OprGodot_windows_x86_64" ]; then
            echo "::error title=Godot export failed::exit code $code"
            grep -iE "error" godot.log | grep -v leaked | tail -12 | tr -cd 'A-Za-z0-9 .,:/_()=+\-\n' | cut -c1-300 | while IFS= read -r line; do
              echo "::error title=godot::${line//::/ }"
            done
            exit 1
          fi
          echo "$GITHUB_SHA" > "$DIR/build-commit.txt"
          { printf 'START HERE: run OnePageRules.exe - the new game.\r\n'
            printf 'Update it from its main menu (the Update button) - no need to download the zip again.\r\n'
            printf 'FdgRaylib.exe is the old version, kept as a backup while the new one is finished.\r\n\r\n'
            cat "$DIR/README.txt"; } > "$DIR/README.new" && mv "$DIR/README.new" "$DIR/README.txt"
          rm -rf dist/OnePageRules-TheGame && mv "$DIR" dist/OnePageRules-TheGame
          ( cd dist && rm -f OnePageRules-TheGame-Windows.zip && zip -rq OnePageRules-TheGame-Windows.zip OnePageRules-TheGame )

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=step::publish started"
          set -e
          trap 'echo "::error title=Publish failed::step line $LINENO exited $?"' ERR
          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +'%Y-%m-%d %H:%M') UTC"
          # Stable download name so a bookmarked link (and the in-game Update button) keeps working across builds.
          test -f dist/OnePageRules-TheGame-Windows.zip

          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

          NOTES="Newest playtest build (commit ${SHORT_SHA}, built ${STAMP}).

          Windows: download OnePageRules-TheGame-Windows.zip, unzip it, run OnePageRules.exe (the new game).
          Already have it? Press Update on its main menu instead. FdgRaylib.exe is the old version, kept as a backup.
          README.txt inside covers unit pictures and playing together over Tailscale.
          Everyone in a game must be on the same build - check the commit number above."

          gh release create latest dist/OnePageRules-TheGame-Windows.zip \
            --title "Latest build (${SHORT_SHA})" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
